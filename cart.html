<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - BakeryShop</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="cart.css">

</head>


<body>


<!-- Navbar -->
<nav class="navbar">

    <!-- Mobile Menu -->
    <button class="menu-toggle" id="menuToggle">☰</button>

    <!-- Logo -->
    <h1>Bakery<span>Shop</span></h1>

    <!-- Search -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products...">
        <button id="searchBtn">🔍</button>

        <div id="searchResults" class="search-results"></div>
    </div>

    <!-- Navigation -->
    <div class="nav-menu" id="navMenu">

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="products.html">Products</a></li>
                            <!-- TRACK ORDER -->

                <li>
                    <a href="trackorder.html">Track Order</a>
                </li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

        <div class="auth-links">
            <a href="login.html">Login</a>
            <span>|</span>
            <a href="signup.html">Sign Up</a>
        </div>

    </div>

    <!-- Cart -->
    <a href="cart.html" class="cart-link">🛒</a>

</nav>



<!-- Cart Page -->

<section class="cart-page">

    <div class="cart-container">


        <p class="small-title">
            YOUR CART
        </p>


        <h1>
            Your Sweet Basket
        </h1>



        <!-- Cart Layout -->

        <div class="cart-layout">


            <!-- LEFT SIDE : CART PRODUCTS -->

            <div id="cartItems">

                <!-- Products will display here -->

            </div>



            <!-- RIGHT SIDE : ORDER SUMMARY -->

            <div class="cart-summary">


                <h2>
                    ORDER SUMMARY
                </h2>


                <!-- All Cart Products -->

               <div class="summary-details" id="summaryDetails">

    <!-- JavaScript will display products here -->

</div>


<div class="summary-total">

    <p>
        Total Quantity:
        <strong id="totalQuantity">0</strong>
    </p>

    <p>
        Total Value:
        <strong id="cartTotal">₹0</strong>
    </p>

</div>


<button id="orderNow">
    ORDER NOW →
</button>


            </div>


        </div>


    </div>

</section>



<script src="cart.js"></script>

<script src="search.js"></script>
<script src="auth.js"></script>

<script>
const menuToggle = document.getElementById("menuToggle");
const navMenu = document.getElementById("navMenu");

menuToggle.addEventListener("click", () => {
    navMenu.classList.toggle("active");
});
</script>
</body>

</html>
