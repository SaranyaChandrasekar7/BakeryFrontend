<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - BakeryShop</title>

<style>

/* =========================================
   GLOBAL
========================================= */

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 30px;
    background: #fff8f0;
    color: #333;
}

h1 {
    color: #6b3e26;
    text-align: center;
    margin-bottom: 25px;
}

h2 {
    color: #6b3e26;
}


/* =========================================
   ADMIN CONTAINER
========================================= */

.admin-container {

    max-width: 1100px;

    margin: 30px auto;

    background: white;

    padding: 25px;

    border-radius: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.10);
}


/* =========================================
   LOGOUT
========================================= */

#logoutBtn {

    display: block;

    margin: 0 auto 25px;

    padding: 11px 25px;

    background: linear-gradient(
        135deg,
        #6b3e26,
        #a0522d
    );

    color: white;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    font-size: 15px;

    font-weight: bold;

    transition: 0.3s;
}

#logoutBtn:hover {

    transform: translateY(-3px);

    box-shadow:
        0 8px 18px rgba(107,62,38,0.30);
}


/* =========================================
   ADD PRODUCT BUTTON
========================================= */

#addProductBtn {

    padding: 12px 22px;

    margin-bottom: 20px;

    border: none;

    border-radius: 10px;

    cursor: pointer;

    font-size: 15px;

    font-weight: bold;

    color: white;

    background: linear-gradient(
        135deg,
        #ff6a00,
        #ee0979,
        #6a11cb
    );

    background-size: 250% 250%;

    animation: gradientMove 5s ease infinite;

    transition: 0.3s;
}

#addProductBtn:hover {

    transform:
        translateY(-3px)
        scale(1.05);

    box-shadow:
        0 10px 25px rgba(238,9,121,0.35);
}

@keyframes gradientMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* =========================================
   PRODUCT FORM
========================================= */

#productForm {

    background: #fff8f0;

    padding: 20px;

    border-radius: 14px;

    margin-bottom: 30px;

    border: 1px solid #eee;

    animation: popup 0.35s ease;
}

@keyframes popup {

    from {

        opacity: 0;

        transform:
            translateY(20px)
            scale(0.96);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}

#productForm h2 {

    margin-top: 0;

    color: #6b3e26;
}

#productForm input,
#productForm select,
#productForm textarea {

    width: 100%;

    padding: 11px;

    margin-bottom: 12px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 14px;

    outline: none;

    transition: 0.3s;
}

#productForm input:focus,
#productForm select:focus,
#productForm textarea:focus {

    border-color: #8b5a2b;

    box-shadow:
        0 0 0 3px rgba(139,90,43,0.10);
}

#productForm textarea {

    min-height: 100px;

    resize: vertical;
}

#productForm label {

    display: block;

    margin-bottom: 8px;

    color: #6b3e26;
}


/* =========================================
   PRICE OPTION
========================================= */

.price-option {

    display: flex;

    gap: 10px;

    margin-bottom: 10px;

    align-items: center;
}

.price-option input {

    flex: 1;

    margin-bottom: 0 !important;
}


/* =========================================
   ADD PRICE OPTION
========================================= */

#addPriceOptionBtn {

    padding: 10px 16px;

    margin-bottom: 15px;

    background: linear-gradient(
        135deg,
        #8b5a2b,
        #c17b3a
    );

    color: white;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    transition: 0.3s;
}

#addPriceOptionBtn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 7px 15px rgba(139,90,43,0.25);
}


/* =========================================
   IMAGE PREVIEW
========================================= */

#imagePreview {

    width: 150px;

    height: 150px;

    object-fit: cover;

    display: none;

    margin: 15px 0;

    border-radius: 12px;

    border: 2px solid #ddd;

    transition: 0.3s;
}


/* =========================================
   SAVE / CANCEL
========================================= */

#saveProductBtn,
#cancelProductBtn {

    padding: 10px 18px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-size: 14px;

    margin-right: 8px;

    transition: 0.3s;
}

#saveProductBtn {

    background: linear-gradient(
        135deg,
        #6b3e26,
        #a0522d
    );

    color: white;

    font-weight: bold;
}

#saveProductBtn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 7px 15px rgba(107,62,38,0.25);
}

#cancelProductBtn {

    background: #ddd;

    color: #333;
}

#cancelProductBtn:hover {

    background: #cfcfcf;
}


/* =========================================
   DASHBOARD SUMMARY
========================================= */

.dashboard-summary {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 20px;

    margin: 20px 0 30px;
}

.summary-card {

    background: linear-gradient(
        135deg,
        #fff,
        #fff8f0
    );

    padding: 20px;

    border-radius: 15px;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.08);

    text-align: center;

    border: 2px solid transparent;

    background-clip: padding-box;

    transition: 0.3s;
}

.summary-card:hover {

    transform: translateY(-5px);

    box-shadow:
        0 10px 25px rgba(107,62,38,0.15);
}

.summary-card h3 {

    margin: 0 0 10px;

    color: #555;
}

.summary-card p {

    font-size: 30px;

    font-weight: bold;

    color: #8b5a2b;

    margin: 0;
}


/* =========================================
   ADMIN OPTIONS
========================================= */

.admin-options {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

    margin: 30px 0;
}

.admin-option-btn {

    width: 100%;

    padding: 18px;

    background: #fff8f0;

    color: #6b3e26;

    border: 2px solid #6b3e26;

    border-radius: 12px;

    cursor: pointer;

    font-size: 17px;

    font-weight: bold;

    transition: 0.3s;
}

.admin-option-btn:hover {

    background: linear-gradient(
        135deg,
        #6b3e26,
        #a0522d
    );

    color: white;

    transform: translateY(-4px);

    box-shadow:
        0 10px 20px rgba(107,62,38,0.20);
}


/* =========================================
   ALL PRODUCTS
========================================= */

#productsSection {

    margin-top: 25px;
}

#productsSection h2 {

    color: #6b3e26;

    margin-bottom: 20px;
}

#productsContainer {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 25px;
}


/* =========================================
   PRODUCT CARD
========================================= */

#productsContainer .product-item {

    position: relative;

    background:
        linear-gradient(
            white,
            white
        ) padding-box,

        linear-gradient(
            135deg,
            #ff9a9e,
            #fad0c4,
            #a18cd1,
            #fbc2eb,
            #84fab0,
            #8fd3f4
        ) border-box;

    border: 2px solid transparent;

    padding: 18px;

    border-radius: 17px;

    background-size:
        100% 100%,
        300% 300%;

    animation:
        productBorderMove 6s ease infinite;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.08);

    transition:
        transform 0.35s ease,
        box-shadow 0.35s ease;
}

#productsContainer .product-item:hover {

    transform:
        translateY(-8px)
        scale(1.02);

    box-shadow:
        0 15px 35px rgba(107,62,38,0.20);
}


/* =========================================
   PRODUCT IMAGE
========================================= */

#productsContainer .product-item img {

    width: 100%;

    height: 200px;

    object-fit: cover;

    border-radius: 13px;

    display: block;

    transition:
        transform 0.4s ease,
        filter 0.4s ease;
}

#productsContainer .product-item:hover img {

    transform: scale(1.05);

    filter: brightness(1.07);
}


/* =========================================
   PRODUCT NAME
========================================= */

#productsContainer .product-item h3 {

    color: #6b3e26;

    margin: 15px 0 8px;

    font-size: 20px;
}


/* =========================================
   PRODUCT DETAILS
========================================= */

#productsContainer .product-item p {

    margin: 7px 0;

    color: #555;

    line-height: 1.5;
}


/* =========================================
   PRODUCT BUTTONS
========================================= */

#productsContainer .product-item button {

    padding: 10px 18px;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;

    margin-top: 12px;

    margin-right: 8px;

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
}


/* EDIT */

#productsContainer .edit-product-btn {

    background: linear-gradient(
        135deg,
        #36d1dc,
        #5b86e5
    );

    color: white;
}

#productsContainer .edit-product-btn:hover {

    transform:
        translateY(-3px)
        scale(1.05);

    box-shadow:
        0 8px 20px rgba(91,134,229,0.35);
}


/* DELETE */

#productsContainer .delete-product-btn {

    background: linear-gradient(
        135deg,
        #ff416c,
        #ff4b2b
    );

    color: white;
}

#productsContainer .delete-product-btn:hover {

    transform:
        translateY(-3px)
        scale(1.05);

    box-shadow:
        0 8px 20px rgba(255,65,108,0.35);
}


/* PRODUCT BORDER ANIMATION */

@keyframes productBorderMove {

    0% {

        background-position:
            0% 0%,
            0% 50%;
    }

    50% {

        background-position:
            0% 0%,
            100% 50%;
    }

    100% {

        background-position:
            0% 0%,
            0% 50%;
    }
}


/* =========================================
   ORDER FILTER
========================================= */

.order-filters {

    display: flex;

    gap: 15px;

    margin: 20px 0;
}

.order-filters input,
.order-filters select {

    padding: 11px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 14px;
}

.order-filters input {

    flex: 1;
}


/* =========================================
   ORDER CARD
========================================= */

.order-card {

    border: 1px solid #ddd;

    padding: 20px;

    margin-bottom: 20px;

    border-radius: 14px;

    background: white;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.06);
}

.order-card h2 {

    color: #6b3e26;

    word-break: break-word;
}

.order-card p {

    margin: 8px 0;

    line-height: 1.5;
}


/* =========================================
   PRODUCTS ORDERED
========================================= */

.products-list {

    margin-top: 20px;

    padding: 15px;

    background: #fff8f0;

    border-radius: 10px;
}

.products-list h3 {

    color: #6b3e26;

    margin-top: 0;
}


/* Order product item */

.products-list .product-item {

    background: white;

    padding: 12px;

    margin-bottom: 10px;

    border-radius: 8px;

    border: 1px solid #eee;
}


/* =========================================
   STATUS BADGES
========================================= */

.status-badge {

    display: inline-block;

    padding: 6px 12px;

    border-radius: 20px;

    font-weight: bold;

    font-size: 14px;
}

.status-pending {

    background: #fff3cd;

    color: #856404;
}

.status-confirmed {

    background: #d4edda;

    color: #155724;
}

.status-preparing {

    background: #d1ecf1;

    color: #0c5460;
}

.status-delivery {

    background: #e2d9f3;

    color: #4b2e83;
}

.status-delivered {

    background: #c3e6cb;

    color: #155724;
}


/* =========================================
   STATUS SELECT
========================================= */

.order-card select {

    padding: 8px;

    margin-left: 10px;

    border: 1px solid #ccc;

    border-radius: 6px;
}


/* =========================================
   ORDER UPDATE BUTTON
========================================= */

.order-card button {

    margin-top: 10px;

    padding: 9px 16px;

    background: linear-gradient(
        135deg,
        #6b3e26,
        #a0522d
    );

    color: white;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    transition: 0.3s;
}

.order-card button:hover {

    transform: translateY(-2px);

    box-shadow:
        0 7px 15px rgba(107,62,38,0.25);
}


/* =========================================
   CUSTOMER MESSAGE
========================================= */

.message-card {

    border: 1px solid #ddd;

    padding: 20px;

    margin-bottom: 20px;

    border-radius: 14px;

    background: white;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.06);

    transition: 0.3s;
}

.message-card:hover {

    transform: translateY(-3px);

    box-shadow:
        0 8px 20px rgba(107,62,38,0.12);
}

.message-card h3 {

    margin-top: 0;

    color: #6b3e26;
}

.message-card p {

    margin: 6px 0;
}

.message-text {

    margin-top: 15px;

    padding: 15px;

    background: #fff8f0;

    border-radius: 10px;

    white-space: pre-wrap;

    line-height: 1.5;
}


/* =========================================
   DELETE MESSAGE
========================================= */

.delete-message-btn {

    margin-top: 15px;

    padding: 9px 16px;

    background: linear-gradient(
        135deg,
        #ff416c,
        #ff4b2b
    );

    color: white;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-weight: bold;

    transition: 0.3s;
}

.delete-message-btn:hover {

    transform:
        translateY(-2px)
        scale(1.03);

    box-shadow:
        0 7px 18px rgba(255,65,108,0.30);
}


/* =========================================
   MOBILE - 800px
========================================= */

@media (max-width: 800px) {

    .dashboard-summary {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .admin-options {

        grid-template-columns: 1fr;
    }

    #productsContainer {

        grid-template-columns:
            repeat(2, 1fr);
    }

}


/* =========================================
   MOBILE - 500px
========================================= */

@media (max-width: 500px) {

    body {

        padding: 15px;
    }

    .admin-container {

        padding: 15px;

        margin: 15px auto;

        border-radius: 12px;
    }

    h1 {

        font-size: 24px;
    }

    .dashboard-summary {

        grid-template-columns: 1fr;

        gap: 12px;
    }

    #productsContainer {

        grid-template-columns: 1fr;

        gap: 18px;
    }

    #productsContainer
    .product-item {

        padding: 15px;
    }

    #productsContainer
    .product-item img {

        height: 200px;
    }

    #productsContainer
    .product-item button {

        width: 100%;

        margin-right: 0;

        margin-top: 10px;
    }

    .order-filters {

        flex-direction: column;
    }

    .order-card {

        padding: 15px;
    }

    .order-card select {

        margin-left: 0;

        margin-top: 8px;

        width: 100%;
    }

    .price-option {

        flex-direction: column;

        align-items: stretch;

        gap: 5px;
    }

    .price-option input {

        width: 100%;
    }

    #saveProductBtn,
    #cancelProductBtn {

        margin-bottom: 8px;
    }

    .message-card {

        padding: 15px;
    }

}

</style>

</head>

<body>

<!-- =========================================
     ADMIN LOGIN PROTECTION
========================================= -->

<script>

if (
    localStorage.getItem("adminLoggedIn")
    !== "true"
) {

    window.location.href =
        "admin-login.html";
}

</script>

<h1>
    BakeryShop Admin Dashboard
</h1>

<button id="logoutBtn">
    Logout
</button>

<div class="admin-container">

<!-- =========================================
     PRODUCT MANAGEMENT
========================================= -->

<h2>
    Product Management
</h2>

<button id="addProductBtn">
    + Add Product
</button>

<div
    id="productForm"
    style="display:none;"
>


<h2>
    Add New Product
</h2>


<input
    type="text"
    id="productName"
    placeholder="Product Name"
>


<select id="productCategory">

    <option value="">
        Select Category
    </option>

    <option value="Cake">
        Cake
    </option>

    <option value="Pastry">
        Pastry
    </option>

    <option value="Cup Cake">
        Cup Cake
    </option>

    <option value="Bread">
        Bread
    </option>

    <option value="Chocolate">
        Chocolate
    </option>

    <option value="Cookies">
        Cookies
    </option>

</select>


<label>
    <b>
        Weight / Pieces & Price
    </b>
</label>


<div id="priceOptionsContainer">

    <div class="price-option">

        <input
            type="text"
            class="productWeight"
            placeholder="Weight / Pieces"
        >

        <input
            type="number"
            class="productPrice"
            placeholder="Price"
        >

    </div>

</div>


<button
    type="button"
    id="addPriceOptionBtn"
>
    + Add Option
</button>


<label>
    <b>
        Product Image
    </b>
</label>


<input
    type="file"
    id="productImage"
    accept="image/*"
>


<img
    id="imagePreview"
    src=""
    alt="Product Preview"
>


<textarea
    id="productDescription"
    placeholder="Product Description"
></textarea>


<button id="saveProductBtn">
    Save Product
</button>


<button id="cancelProductBtn">
    Cancel
</button>


</div>

<!-- =========================================
     DASHBOARD SUMMARY
========================================= -->

<h2>
    Dashboard Summary
</h2>

<div class="dashboard-summary">


<div class="summary-card">

    <h3>
        Total Orders
    </h3>

    <p id="totalOrders">
        0
    </p>

</div>


<div class="summary-card">

    <h3>
        Pending
    </h3>

    <p id="pendingOrders">
        0
    </p>

</div>


<div class="summary-card">

    <h3>
        Preparing
    </h3>

    <p id="preparingOrders">
        0
    </p>

</div>


<div class="summary-card">

    <h3>
        Delivered
    </h3>

    <p id="deliveredOrders">
        0
    </p>

</div>


</div>

<!-- =========================================
     ADMIN OPTIONS
========================================= -->

<div class="admin-options">


<button
    id="allProductsBtn"
    class="admin-option-btn"
>
    📦 All Products
</button>


<button
    id="customerDetailsBtn"
    class="admin-option-btn"
>
    👤 Customer Details
</button>


<button
    id="customerMessagesBtn"
    class="admin-option-btn"
>
    💬 Customer Messages
</button>

</div>

<!-- =========================================
     ALL PRODUCTS
========================================= -->

<div
    id="productsSection"
    style="display:none;"
>


<h2>
    All Products
</h2>

<div id="productsContainer">
    Loading products...
</div>


</div>

<!-- =========================================
     CUSTOMER ORDERS / DETAILS
========================================= -->

<div
    id="ordersSection"
    style="display:none;"
>


<h2>
    Customer Orders
</h2>


<div class="order-filters">


    <input
        type="text"
        id="orderSearch"
        placeholder="Search customer or Order ID..."
    >


    <select id="statusFilter">

        <option value="All">
            All Orders
        </option>

        <option value="Pending">
            Pending
        </option>

        <option value="Confirmed">
            Confirmed
        </option>

        <option value="Preparing">
            Preparing
        </option>

        <option value="Out for Delivery">
            Out for Delivery
        </option>

        <option value="Delivered">
            Delivered
        </option>

    </select>


</div>


<div id="ordersContainer">
    Loading orders...
</div>

</div>

<!-- =========================================
     CUSTOMER MESSAGES
========================================= -->

<div
    id="messagesSection"
    style="display:none;"
>


<h2>
    Customer Messages
</h2>


<div id="messagesContainer">
    Loading messages...
</div>


</div>

</div>

<script src="admin.js"></script>

</body>

</html>
