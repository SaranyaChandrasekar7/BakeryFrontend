<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | BakeryShop</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#fff7f0;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .login-box{
      width:380px;
      background:#fff;
      padding:35px;
      border-radius:15px;
      box-shadow:0 10px 30px rgba(0,0,0,.12);
    }

    h1{
      text-align:center;
      color:#8b5a2b;
      margin-bottom:25px;
    }

    label{
      display:block;
      margin:12px 0 6px;
      font-weight:bold;
      color:#444;
    }

    input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
    }

    button{
      width:100%;
      margin-top:20px;
      padding:12px;
      background:#8b5a2b;
      color:white;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#6d4520;
    }

    #errorMessage{
      color:red;
      text-align:center;
      margin-top:15px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Bakery Admin</h1>

    <form id="adminLoginForm">

      <label>Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter Username"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
      >

      <button type="submit">Login</button>

      <p id="errorMessage"></p>

    </form>

  </div>

  <script src="admin-login.js"></script>

</body>


</html>
